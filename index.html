<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keyboard Practice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Tone.js (UMD build) -->
    <script src="https://cdn.jsdelivr.net/npm/tone@14.9.17/build/Tone.js"></script>

    <!-- OpenSheetMusicDisplay (UMD build) -->
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js"></script>

    <!-- Roboto font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Keyboard Practice</h1>
    </header>

    <main>
      <!-- ---------- Controls ---------- -->

      <div class="playback-controls">
       <div class="controls-row top-row">
  <select id="songSelect"></select>
  <select id="tempoSelect" class="hidden"></select>

</div>



<!-- 
    <div class="row tempo-row">
</div> -->

      <div class="row volume-row">
          <label>
            🎹 Piano Volume
            <input
              id="pianoVol"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0.5"
            />
          </label>

          <label>
            🎸 Guitar Volume
            <input
              id="guitarVol"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0.3"
            />
          </label>
        </div>

        </div>

        <!-- Second row: Volume controls -->
  

        <!-- Status row (moved inside controls) -->
        <!-- <div class="row status-row">
          <div id="status" class="status">Loading…</div>
        </div> -->
      <!-- </div> -->

      <!-- ---------- Notation + Keyboard ---------- -->
      <div class="notation-keyboard">
        <div class="notation hidden" id="music" ></div> </div>
        <div class="keyboard" id="keyboard"></div>
      </div>
<div class="bottom-controls">  <button id="playBtn" class="control-btn">▶ Play</button>
  <button id="stopBtn" class="control-btn">⏹ Stop</button>
  <button id="loopBtn" class="control-btn loop-off">🔁 Loop</button>
 <div class="loop-controls">
<div class="loop-controls">
  <div class="loop-group">
    <label for="loopStart">Start bar</label>
    <input id="loopStart" type="number" value="1" />
  </div>

  <div class="loop-group">
    <label for="loopEnd">End bar</label>
    <input id="loopEnd" type="number" value="1" />
  </div>
</div>




</div>

    </main>

    <script src="script.js"></script>
  </body>
</html>
